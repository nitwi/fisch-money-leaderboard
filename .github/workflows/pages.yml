name: Publish evidence site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate screenshot proof, generated ledger, and calculations
        run: |
          python tools/promote_photo_review.py
          git diff --exit-code -- data/photo_verified.csv
          python tools/build.py --no-copy
          python -m unittest discover -s tests
          node --check site/app.js
          node --check site/standouts.js
          node --check site/networker-core.js
          node --check site/username-patterns.js
          node --check site/network-graph.js
          node --check site/networker.js
          node --check site/networker-focus.js
          node --test tests/test_networker.cjs tests/test_networker_focus.cjs tests/test_username_patterns.cjs tests/test_network_graph.cjs tests/network-graph-evidence.test.cjs
          git diff --exit-code -- site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Wait for the uploaded Pages artifact to become visible
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          name = os.environ["PAGES_ARTIFACT"]
          api, repo, run = (os.environ[k] for k in ("GITHUB_API_URL", "GITHUB_REPOSITORY", "GITHUB_RUN_ID"))
          url = f"{api}/repos/{repo}/actions/runs/{run}/artifacts?{urlencode({'name': name})}"
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
          })
          for attempt in range(12):
              try:
                  with urlopen(request, timeout=5) as response:
                      artifacts = json.load(response)["artifacts"]
                  if any(a["name"] == name and not a["expired"] for a in artifacts):
                      print(f"Pages artifact {name} is ready.")
                      break
              except HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
              except (URLError, TimeoutError):
                  pass
              if attempt < 11:
                  time.sleep(5)
          else:
              raise SystemExit(f"Pages artifact {name} was not visible after 12 checks.")
          PYTHON
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
