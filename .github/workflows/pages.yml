name: Publish evidence site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate screenshot proof, generated ledger, and calculations
        run: |
          python tools/promote_photo_review.py
          git diff --exit-code -- data/photo_verified.csv
          python tools/build.py --no-copy
          python -m unittest discover -s tests
          node --check site/app.js
          git diff --exit-code -- site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
